<div id="shop-wrapper">
  <div class="shop-hero">
    <h1>🏀 Entradas NBA</h1>
    <p>Encuentra entradas para todos los eventos y partidos de la NBA</p>
  </div>

  <div id="shop-layout">

    <!-- ── SIDEBAR FILTROS ──────────────────────────────────── -->
    <aside id="shop-sidebar"> </aside>

    <!-- ── MAIN ────────────────────────────────────────────── -->
    <main id="shop-main">

      <!-- Lista -->
      <div id="shop-list-view">
        <div id="shop-order-bar">
          <div id="shop-results-info"></div>
          <div id="order-dropdown-wrap">
            <button id="order-dropdown-btn">
              Ordenar: <span id="order-label">Sin ordenar</span>
              <span class="ob-arrow">▼</span>
            </button>
            <ul id="order-dropdown-list">
              <li class="order-option" data-value="0">Sin ordenar</li>
              <li class="order-option" data-value="precio_asc">Precio: menor a mayor</li>
              <li class="order-option" data-value="precio_desc">Precio: mayor a menor</li>
              <li class="order-option" data-value="fecha_asc">Fecha: más próxima</li>
              <li class="order-option" data-value="fecha_desc">Fecha: más lejana</li>
            </ul>
          </div>
        </div>
        <div id="shop-tickets-grid">
          <div class="shop-spinner">Cargando entradas…</div>
        </div>
        <div id="shop-pagination"></div>
      </div>

      <!-- Detalle -->
      <div id="shop-detail-view" style="display:none">
        <button class="tc-btn-back" id="btn-back-list">← Volver a resultados</button>
        <div id="shop-detail-content"></div>

        <!-- Entradas relacionadas -->
        <div id="related-tickets-section" style="display:none; margin-top:36px">
          <h3 class="related-title">Entradas relacionadas</h3>
          <div class="related-list"></div>
          <div class="related-more-wrap"></div>
        </div>

        <div class="pd-map-section" style="margin-top:36px">
          <p class="pd-map-label">📍 Ubicación del recinto</p>
          <div id="detail-map" class="detail-map"></div>
        </div>
      </div>

      <!-- Mapa principal -->
      <div id="shop-map-wrap" class="shop-main-map-wrap">
        <p class="shop-main-map-label">📍 Todos los recintos NBA</p>
        <div id="shop-main-map"></div>
      </div>

    </main>
  </div>
</div>

<script src="module/1_shop/model/ctrl_shop.js"></script>
